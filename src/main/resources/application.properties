spring.application.name=shopping-agent
spring.datasource.url=jdbc:h2:mem:catalog
spring.jpa.hibernate.ddl-auto=create

# Gemini. The key is read from the GEMINI_API_KEY environment variable (never put it here).
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.1-flash-lite
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# SerpApi (Google Shopping). The key is read from the SERPAPI_API_KEY environment variable.
serpapi.api-key=${SERPAPI_API_KEY:}
serpapi.base-url=https://serpapi.com
serpapi.max-results=5
