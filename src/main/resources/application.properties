spring.application.name=shopping-agent
spring.datasource.url=jdbc:h2:mem:catalog
spring.jpa.hibernate.ddl-auto=create

# Gemini. The key is read from the GEMINI_API_KEY environment variable (never put it here).
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.1-flash-lite
# Used when the main model stays overloaded (HTTP 429/5xx) after all retries. Blank = no fallback.
gemini.fallback-model=gemini-3.5-flash-lite
# Each model is tried up to max-attempts times; waits 1s, then 2s, between attempts.
gemini.max-attempts=3
gemini.retry-delay-millis=1000
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# SerpApi (Google Shopping). The key is read from the SERPAPI_API_KEY environment variable.
serpapi.api-key=${SERPAPI_API_KEY:}
serpapi.base-url=https://serpapi.com
serpapi.max-results=5

# Conversation memory (kept in the server's memory; lost on restart).
conversation.max-turns=10
conversation.ttl-minutes=30
conversation.max-sessions=1000
